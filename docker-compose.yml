services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: tripmap-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tripmap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tripmap_secret}
      POSTGRES_DB: ${POSTGRES_DB:-tripmap}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tripmap} -d ${POSTGRES_DB:-tripmap}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rustfs:
    image: rustfs/rustfs:latest
    container_name: tripmap-rustfs
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-rustfsadmin_secret}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "${RUSTFS_API_PORT:-9002}:9000"
      - "${RUSTFS_CONSOLE_PORT:-9003}:9001"
    volumes:
      - rustfs_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tripmap-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://tripmap:tripmap_secret@postgres:5432/tripmap}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://rustfs:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-rustfsadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-rustfsadmin_secret}
      S3_REGION: ${S3_REGION:-us-east-1}
      IMPORT_DIR: /import
      TRIP_MAX_HOURS_GAP: ${TRIP_MAX_HOURS_GAP:-36}
      TRIP_MAX_DISTANCE_KM: ${TRIP_MAX_DISTANCE_KM:-85}
      FACE_SIMILARITY_THRESHOLD: ${FACE_SIMILARITY_THRESHOLD:-0.48}
      MODEL_CACHE_DIR: /model_cache
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:3002/api/auth/google/callback}
    ports:
      - "${BACKEND_PORT:-8002}:8000"
    volumes:
      - ./backend/app:/app/app
      - ${LOCAL_IMPORT_HOST_PATH:-./import_media}:/import
      - model_cache:/model_cache
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tripmap-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3002}:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  rustfs_data:
  model_cache:
